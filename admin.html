<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photowalla — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Cormorant+SC:wght@500;600&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --cream:#FAF8F4; --warm:#F5F2EC; --parchment:#EDE8DF; --charcoal:#1C1C1C;
  --brown:#2A1A0E; --brown-l:#3A2716; --gold:#A8844A; --gold-l:#C9A96E;
  --grey:#7A7065; --rule:#DDD8CF; --red:#B13A2F; --green:#4C7A5A;
}
body{background:var(--warm);color:var(--charcoal);font-family:'Montserrat',sans-serif;font-weight:400;font-size:14px}
img{max-width:100%;display:block}
button{font-family:inherit;cursor:pointer}
input,textarea{font-family:'Montserrat',sans-serif}
.hidden{display:none !important}

/* ── LOGIN ── */
#loginScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--brown);padding:24px}
.login-box{background:var(--cream);padding:56px 44px;max-width:380px;width:100%;text-align:center;border:1px solid rgba(201,169,110,.3)}
.login-brand{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:32px;color:var(--brown);margin-bottom:6px}
.login-sub{font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--gold);margin-bottom:36px}
.login-box input{width:100%;background:var(--warm);border:1px solid var(--rule);padding:14px 16px;font-size:13px;margin-bottom:14px;outline:none;letter-spacing:1px}
.login-box input:focus{border-color:var(--gold)}
.login-btn{width:100%;background:var(--gold);color:#fff;border:none;padding:14px;font-size:10px;letter-spacing:3px;text-transform:uppercase;transition:background .25s}
.login-btn:hover{background:var(--brown)}
.login-error{color:var(--red);font-size:11px;margin-top:14px;letter-spacing:.5px;min-height:14px}

/* ── LAYOUT ── */
#adminApp{display:flex;min-height:100vh}
.sidebar{width:220px;flex-shrink:0;background:var(--brown);display:flex;flex-direction:column;position:fixed;top:0;bottom:0;left:0;z-index:200}
.sidebar-brand{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:20px;color:var(--cream);padding:26px 24px 20px;border-bottom:1px solid rgba(201,169,110,.15)}
.sidebar-brand small{display:block;font-family:'Montserrat',sans-serif;font-style:normal;font-size:8px;letter-spacing:2px;color:var(--gold-l);text-transform:uppercase;margin-top:5px}
.sidebar-nav{flex:1;overflow-y:auto;padding:14px 0}
.nav-item{display:flex;align-items:center;gap:12px;padding:13px 24px;color:rgba(250,248,244,.55);text-decoration:none;font-size:9px;letter-spacing:2px;text-transform:uppercase;cursor:pointer;border-left:2px solid transparent;transition:all .2s}
.nav-item .ic{width:15px;text-align:center;font-size:13px}
.nav-item:hover{color:var(--cream);background:rgba(255,255,255,.03)}
.nav-item.active{color:var(--gold-l);border-left-color:var(--gold);background:rgba(201,169,110,.07)}
.sidebar-foot{padding:16px 24px 22px;border-top:1px solid rgba(201,169,110,.15);display:flex;flex-direction:column;gap:10px}
.sidebar-foot a,.sidebar-foot button{background:none;border:none;color:rgba(250,248,244,.45);font-size:9px;letter-spacing:2px;text-transform:uppercase;text-align:left;padding:0;text-decoration:none}
.sidebar-foot a:hover,.sidebar-foot button:hover{color:var(--gold-l)}

.main{margin-left:220px;flex:1;min-height:100vh;display:flex;flex-direction:column}
.topbar{background:var(--cream);border-bottom:1px solid var(--rule);padding:22px 40px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.topbar h1{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:500;font-size:26px;color:var(--brown)}
.topbar-right{display:flex;align-items:center;gap:16px}
.save-status{font-size:10px;letter-spacing:1px;color:var(--grey)}
.save-status.dirty{color:var(--gold)}
.save-status.ok{color:var(--green)}
.save-btn{background:var(--gold);color:#fff;border:none;padding:13px 34px;font-size:10px;letter-spacing:3px;text-transform:uppercase;transition:background .25s}
.save-btn:hover{background:var(--brown)}
.save-btn:disabled{opacity:.5;cursor:default}

.content{padding:40px;flex:1}
.section-panel{max-width:1100px}
.panel-intro{font-family:'Montserrat',sans-serif;color:var(--grey);font-size:13px;line-height:1.7;margin-bottom:32px;max-width:640px}
.panel-intro strong{color:var(--brown)}

.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:36px;max-width:640px}
.stat-card{background:var(--cream);border:1px solid var(--rule);padding:26px 20px;text-align:center}
.stat-num{font-family:'Cormorant SC',serif;font-size:34px;font-weight:600;color:var(--brown)}
.stat-lbl{font-size:8px;letter-spacing:2px;text-transform:uppercase;color:var(--gold);margin-top:8px}

.card{background:var(--cream);border:1px solid var(--rule);padding:28px;margin-bottom:24px}
.card-title{font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--gold);margin-bottom:18px}

.slot-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.slot{position:relative;aspect-ratio:3/4;border:1.5px dashed var(--rule);background:var(--warm);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;transition:border-color .2s}
.slot:hover{border-color:var(--gold)}
.slot.filled{border-style:solid}
.slot img,.slot video{width:100%;height:100%;object-fit:cover}
.slot-num{position:absolute;top:6px;left:8px;font-size:10px;color:rgba(255,255,255,.9);text-shadow:0 1px 3px rgba(0,0,0,.6);z-index:2;font-weight:600}
.slot-plus{width:30px;height:30px;border:1px solid var(--gold);border-radius:50%;color:var(--gold);display:flex;align-items:center;justify-content:center;font-size:16px;margin-bottom:8px}
.slot-txt{font-size:8px;letter-spacing:1.5px;text-transform:uppercase;color:var(--grey);text-align:center;padding:0 8px}
.slot-remove{position:absolute;top:6px;right:6px;width:22px;height:22px;background:rgba(28,28,28,.65);color:#fff;border:none;border-radius:50%;font-size:12px;display:flex;align-items:center;justify-content:center;z-index:3}
.slot-remove:hover{background:var(--red)}
.slot input[type=file]{display:none}
.slot-progress{position:absolute;inset:0;background:rgba(28,28,28,.55);display:none;align-items:center;justify-content:center;color:#fff;font-size:9px;letter-spacing:2px;text-transform:uppercase;z-index:4}
.slot.loading .slot-progress{display:flex}

.note-box{margin-top:22px;background:var(--parchment);border:1px solid var(--rule);padding:16px 20px;font-size:11.5px;color:var(--brown);line-height:1.8}
.note-box b{color:var(--gold)}

.form-row{display:flex;flex-direction:column;gap:7px;margin-bottom:16px}
.form-row label{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--gold)}
.form-row input,.form-row textarea{background:var(--warm);border:1px solid var(--rule);padding:12px 14px;font-size:13px;outline:none}
.form-row input:focus,.form-row textarea:focus{border-color:var(--gold)}
.form-row textarea{min-height:80px;resize:vertical}
.form-hint{font-size:10.5px;color:var(--grey);margin-top:2px}

.repeat-card{background:var(--cream);border:1px solid var(--rule);padding:24px;margin-bottom:18px;display:grid;grid-template-columns:130px 1fr;gap:22px;position:relative}
.repeat-card .slot{aspect-ratio:3/4}
.repeat-fields{display:flex;flex-direction:column;justify-content:center;gap:12px}
.repeat-remove{position:absolute;top:14px;right:14px;background:none;border:1px solid var(--rule);color:var(--grey);font-size:9px;letter-spacing:1.5px;text-transform:uppercase;padding:6px 12px}
.repeat-remove:hover{border-color:var(--red);color:var(--red)}
@media(max-width:640px){.repeat-card{grid-template-columns:1fr}}

.add-btn{border:1px solid var(--gold);background:transparent;color:var(--gold);padding:13px 30px;font-size:9px;letter-spacing:2.5px;text-transform:uppercase;transition:all .2s}
.add-btn:hover{background:var(--gold);color:#fff}

.remove-line-btn{background:none;border:none;color:var(--grey);font-size:14px;line-height:1;padding:4px 8px}
.remove-line-btn:hover{color:var(--red)}

.tabs{display:flex;gap:0;margin-bottom:18px;border-bottom:1px solid var(--rule)}
.tab-btn{background:none;border:none;padding:10px 18px;font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--grey);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab-btn.active{color:var(--brown);border-bottom-color:var(--gold)}

.toast{position:fixed;bottom:24px;right:24px;background:var(--brown);color:var(--cream);padding:14px 24px;font-size:11px;letter-spacing:1px;z-index:2000;opacity:0;transform:translateY(10px);transition:all .3s;pointer-events:none}
.toast.show{opacity:1;transform:translateY(0)}
.toast.err{background:var(--red)}

.hamburger-admin{display:none}
@media(max-width:900px){
  .sidebar{transform:translateX(-100%);transition:transform .3s;width:240px}
  .sidebar.open{transform:translateX(0)}
  .main{margin-left:0}
  .hamburger-admin{display:flex;align-items:center;justify-content:center;width:36px;height:36px;border:1px solid var(--rule);background:none;font-size:16px;color:var(--brown)}
  .topbar h1{font-size:20px}
  .content{padding:24px 20px}
  .stats-row{grid-template-columns:1fr 1fr 1fr;gap:10px}
}
</style>
</head>
<body>

<!-- ═══════════════════════ LOGIN ═══════════════════════ -->
<div id="loginScreen">
  <div class="login-box">
    <div class="login-brand">Photowalla</div>
    <div class="login-sub">Admin Access</div>
    <input type="password" id="pwInput" placeholder="Enter password" autocomplete="off">
    <button class="login-btn" id="pwSubmit">Enter Admin Panel</button>
    <div class="login-error" id="pwError"></div>
  </div>
</div>

<!-- ═══════════════════════ ADMIN APP ═══════════════════════ -->
<div id="adminApp" class="hidden">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">Photowalla<small>Admin Panel</small></div>
    <nav class="sidebar-nav" id="sidebarNav">
      <div class="nav-item" data-section="hero"><span class="ic">◐</span> Hero Section</div>
      <div class="nav-item" data-section="intro"><span class="ic">✎</span> Intro Section</div>
      <div class="nav-item" data-section="grid"><span class="ic">▦</span> Photography Grid + Entrance</div>
      <div class="nav-item" data-section="filmstrip"><span class="ic">▭</span> Selected Frames</div>
      <div class="nav-item" data-section="soulcinema"><span class="ic">◑</span> Soul + Cinema</div>
      <div class="nav-item" data-section="stories"><span class="ic">♥</span> Love Stories</div>
      <div class="nav-item" data-section="films"><span class="ic">▶</span> Films</div>
      <div class="nav-item" data-section="testimonials"><span class="ic">✦</span> Testimonials</div>
      <div class="nav-item" data-section="about"><span class="ic">☰</span> About Page</div>

  <div class="main">
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:14px">
        <button class="hamburger-admin" id="hamburgerAdmin">☰</button>
        <h1 id="panelTitle">Hero Section</h1>
      </div>
      <div class="topbar-right">
        <span class="save-status" id="saveStatus">All changes saved</span>
        <button class="save-btn" id="saveBtn">Save Changes</button>
      </div>
    </div>
    <div class="content">
      <div class="section-panel" id="sectionContent"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ══════════════════════════════════════════
   AUTH
══════════════════════════════════════════ */
const ADMIN_PASSWORD = 'photowalla.in2026';

/* Storage connection — fixed in code so it never appears as an
   editable/visible field in the admin interface. */
const STORAGE_BIN_ID = '6a7370e8f5f4af5e29ef5a2f';
const STORAGE_API_KEY = '$2a$10$k6B/yUZ/sqKKaHjVGCfMJuTNI1OmXnNCbiK/j1INWem.2xng6mUfm';
const loginScreen = document.getElementById('loginScreen');
const adminApp = document.getElementById('adminApp');

function tryLogin(){
  const val = document.getElementById('pwInput').value;
  if (val === ADMIN_PASSWORD){
    localStorage.setItem('pw_admin_session','1');
    enterAdmin();
  } else {
    document.getElementById('pwError').textContent = 'Incorrect password. Please try again.';
  }
}
document.getElementById('pwSubmit').addEventListener('click', tryLogin);
document.getElementById('pwInput').addEventListener('keydown', e => { if (e.key === 'Enter') tryLogin(); });
document.getElementById('logoutBtn').addEventListener('click', () => {
  localStorage.removeItem('pw_admin_session');
  location.reload();
});

function enterAdmin(){
  loginScreen.classList.add('hidden');
  adminApp.classList.remove('hidden');
  loadState().then(() => renderSection(currentSection));
}
if (localStorage.getItem('pw_admin_session') === '1') enterAdmin();

/* ══════════════════════════════════════════
   STATE — mirrors the JSON structure the live
   website reads from JSONBin (state.frames,
   state.stories, state.films, state.about,
   state.store, etc).
══════════════════════════════════════════ */
let state = {
  hero: '',
  intro: { left:'', right:'', mobile:'' },
  frames: new Array(14).fill(''),
  filmstrip: [],
  soulCinema: { video:'', heading:'Soul + Cinema', text:'' },
  stories: [],
  films: [],
  testimonials: [],
  about: { photo:'', name:'', tagline:'', bio:'', accolades:[] },
  store: [],
  liveLink: ''
};
let dirty = false;

function markDirty(){
  dirty = true;
  const s = document.getElementById('saveStatus');
  s.textContent = 'Unsaved changes'; s.className = 'save-status dirty';
}
function markSaved(){
  dirty = false;
  const s = document.getElementById('saveStatus');
  s.textContent = 'All changes saved'; s.className = 'save-status ok';
}

function getBinConfig(){
  return { binId: STORAGE_BIN_ID, apiKey: STORAGE_API_KEY };
}

async function loadState(){
  const { binId, apiKey } = getBinConfig();
  try{
    const res = await fetch(`https://api.jsonbin.io/v3/b/${binId}/latest?t=${Date.now()}`, { headers: { 'X-Master-Key': apiKey } });
    if (!res.ok) throw new Error('fetch failed');
    const data = await res.json();
    const rec = data.record || {};
    state = {
      hero: rec.hero || '',
      intro: rec.intro || { left:'', right:'', mobile:'' },
      frames: (rec.frames && rec.frames.length) ? padFrames(rec.frames) : new Array(14).fill(''),
      filmstrip: rec.filmstrip || [],
      soulCinema: rec.soulCinema || { video:'', heading:'Soul + Cinema', text:'' },
      stories: rec.stories || [],
      films: rec.films || [],
      testimonials: rec.testimonials || [],
      about: rec.about || { photo:'', name:'', tagline:'', bio:'', accolades:[] },
      store: rec.store || [],
      liveLink: rec.liveLink || ''
    };
    showToast('Content loaded from your bin');
  } catch(e){
    showToast('Could not load saved content — starting fresh', true);
  }
}
function padFrames(arr){
  const out = arr.slice(0,14);
  while (out.length < 14) out.push('');
  return out;
}

async function saveState(){
  const { binId, apiKey } = getBinConfig();
  const btn = document.getElementById('saveBtn');
  btn.disabled = true; btn.textContent = 'Saving…';
  try{
    const res = await fetch(`https://api.jsonbin.io/v3/b/${binId}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json', 'X-Master-Key': apiKey },
      body: JSON.stringify(state)
    });
    if (!res.ok) throw new Error('save failed');
    markSaved();
    showToast('Saved — your website will update within a minute');
  } catch(e){
    showToast('Save failed. Check your Bin ID / Master Key in Settings.', true);
  } finally {
    btn.disabled = false; btn.textContent = 'Save Changes';
  }
}
document.getElementById('saveBtn').addEventListener('click', saveState);

function showToast(msg, isErr){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (isErr ? ' err' : '');
  setTimeout(() => t.className = 'toast', 2800);
}

/* ══════════════════════════════════════════
   CLOUDINARY — real image/video hosting.
   Files upload here; only the short link gets
   saved to JSONBin, so there's no size limit
   problem anymore.
══════════════════════════════════════════ */
const CLOUDINARY_CLOUD_NAME = 'nqapapkj';
const CLOUDINARY_UPLOAD_PRESET = 'photo walla';

async function uploadToCloudinary(blob, resourceType){
  const form = new FormData();
  form.append('file', blob);
  form.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);
  const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/${resourceType}/upload`, {
    method: 'POST', body: form
  });
  if (!res.ok){
    throw new Error('Upload failed — double check the upload preset is set to Unsigned in Cloudinary.');
  }
  const data = await res.json();
  return data.secure_url;
}

function compressImageToBlob(file, maxDim, quality){
  return new Promise((resolve, reject) => {
    if (!file.type.startsWith('image/')){ reject(new Error('Please choose an image file (JPG or PNG).')); return; }
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if (w > maxDim || h > maxDim){
          if (w > h){ h = Math.round(h * maxDim / w); w = maxDim; }
          else { w = Math.round(w * maxDim / h); h = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        canvas.toBlob(blob => {
          if (blob) resolve(blob); else reject(new Error('Could not process that image.'));
        }, 'image/jpeg', quality);
      };
      img.onerror = () => reject(new Error('Could not read that image.'));
      img.src = e.target.result;
    };
    reader.onerror = () => reject(new Error('Could not read that file.'));
    reader.readAsDataURL(file);
  });
}
function checkFileSize(file, maxMB){
  if (file.size > maxMB * 1024 * 1024) throw new Error(`Please choose a file under ${maxMB}MB.`);
  return file;
}
async function uploadImage(file){
  const blob = await compressImageToBlob(file, 1400, 0.75);
  return uploadToCloudinary(blob, 'image');
}
async function uploadVideo(file){
  checkFileSize(file, 25);
  return uploadToCloudinary(file, 'video');
}
function ytId(url){
  if (!url) return null;
  const m = url.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|live\/|shorts\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
  return m ? m[1] : null;
}
/* Turn any YouTube watch/share link into a proper embed link.
   If it's already an embed link (YouTube or Vimeo), leave it as-is. */
function toEmbedUrl(url){
  if (!url) return '';
  const trimmed = url.trim();
  const id = ytId(trimmed);
  if (id) return `https://www.youtube.com/embed/${id}`;
  return trimmed;
}

/* ══════════════════════════════════════════
   NAV / ROUTING
══════════════════════════════════════════ */
const titles = {
  hero:'Hero Section', intro:'Intro Section', grid:'Photography Grid + Entrance',
  filmstrip:'Selected Frames', soulcinema:'Soul + Cinema', stories:'Love Stories',
  films:'Films', testimonials:'Testimonials', about:'About Page', store:'Store', live:'Live Stream'
};
let currentSection = 'hero';
document.querySelectorAll('.nav-item').forEach(item => {
  item.addEventListener('click', () => {
    currentSection = item.dataset.section;
    renderSection(currentSection);
    document.getElementById('sidebar').classList.remove('open');
  });
});
document.getElementById('hamburgerAdmin').addEventListener('click', () => {
  document.getElementById('sidebar').classList.toggle('open');
});

function renderSection(name){
  document.querySelectorAll('.nav-item').forEach(i => i.classList.toggle('active', i.dataset.section === name));
  document.getElementById('panelTitle').textContent = titles[name];
  const c = document.getElementById('sectionContent');
  c.innerHTML = '';
  const renderers = {
    hero:renderHero, intro:renderIntro, grid:renderGrid, filmstrip:renderFilmstrip,
    soulcinema:renderSoulCinema, stories:renderStories, films:renderFilms,
    testimonials:renderTestimonials, about:renderAbout, store:renderStore, live:renderLive
  };
  renderers[name](c);
}

/* helper: build a single upload slot */
function buildSlot({ value, label='', onFile, onRemove, kind='image', numberLabel=null }){
  const slot = document.createElement('div');
  slot.className = 'slot' + (value ? ' filled' : '');
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = kind === 'video' ? 'video/*' : 'image/*';
  slot.appendChild(input);

  const progress = document.createElement('div');
  progress.className = 'slot-progress';
  progress.textContent = 'Uploading…';
  slot.appendChild(progress);

  function paint(){
    slot.querySelectorAll('img,video,.slot-plus,.slot-txt,.slot-remove,.slot-num').forEach(el => el.remove());
    if (numberLabel){
      const num = document.createElement('span'); num.className='slot-num'; num.textContent = numberLabel;
      slot.appendChild(num);
    }
    if (value){
      slot.classList.add('filled');
      const media = kind === 'video' ? document.createElement('video') : document.createElement('img');
      media.src = value;
      if (kind === 'video'){ media.muted = true; }
      slot.insertBefore(media, progress);
      const rm = document.createElement('button');
      rm.className = 'slot-remove'; rm.type='button'; rm.textContent = '×';
      rm.onclick = (e) => { e.stopPropagation(); value = ''; onRemove(); paint(); };
      slot.appendChild(rm);
    } else {
      slot.classList.remove('filled');
      const plus = document.createElement('div'); plus.className='slot-plus'; plus.textContent='+';
      const txt = document.createElement('p'); txt.className='slot-txt'; txt.textContent = label || 'Tap to upload';
      slot.insertBefore(plus, progress);
      slot.insertBefore(txt, progress);
    }
  }
  paint();

  slot.addEventListener('click', () => input.click());
  input.addEventListener('change', async () => {
    const file = input.files[0];
    if (!file) return;
    slot.classList.add('loading');
    try{
      const url = kind === 'video' ? await uploadVideo(file) : await uploadImage(file);
      value = url;
      onFile(url);
      markDirty();
      paint();
    } catch(err){
      showToast(err.message, true);
    } finally {
      slot.classList.remove('loading');
      input.value = '';
    }
  });
  return slot;
}

function slugify(str){
  return (str||'').toLowerCase().trim()
    .replace(/&/g, 'and')
    .replace(/[^a-z0-9]+/g, '-')
    .replace(/^-+|-+$/g, '') || 'story';
}
function uniqueSlug(base, excludeIndex){
  let slug = base, n = 2;
  while (state.stories.some((s,i) => i !== excludeIndex && s.slug === slug)) slug = `${base}-${n++}`;
  return slug;
}

      const priceInp = fields.querySelector('[data-f="price"]');
      nameInp.addEventListener('input', () => { p.name = nameInp.value; markDirty(); });
      priceInp.addEventListener('input', () => { p.price = Number(priceInp.value) || 0; markDirty(); });
      card.appendChild(fields);
      wrap.appendChild(card);
    });
  }
  paint();
  const addBtn = document.createElement('button'); addBtn.className='add-btn'; addBtn.textContent='+ Add Product';
  addBtn.onclick = () => { state.store.push({ id: Date.now(), name:'', price:0, image:'' }); markDirty(); paint(); };
  c.appendChild(addBtn);
  c.appendChild(noteBox('<b>Recommended size:</b> 1000 × 1300 px (portrait) · JPG · under 8 MB for the product photo.'));
}

/* ══════════════════════════════════════════
   LIVE STREAM
══════════════════════════════════════════ */
function renderLive(c){
  c.innerHTML = `<p class="panel-intro">Paste your YouTube Live link on the wedding day — it appears on the website automatically, and switches back to the placeholder once removed.</p>`;
  const card = document.createElement('div'); card.className='card';
  card.innerHTML = `<div class="card-title">YouTube Live Link</div>`;
  const row = document.createElement('div'); row.className='form-row';
  row.innerHTML = `<label>Live stream URL</label><input id="liveInput" value="${state.liveLink||''}" placeholder="https://youtube.com/watch?v=...">`;
  card.appendChild(row);
  card.querySelector('input').addEventListener('input', e => { state.liveLink = e.target.value; markDirty(); });
  c.appendChild(card);
  c.appendChild(noteBox('<b>Tip:</b> Go live on YouTube, copy the video link (not the studio link), and paste it here. Leave empty when there\'s no active stream.'));
}

</script>
